name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://workspace:workspace@localhost:5432/workspace_test
      JWT_ACCESS_SECRET: ci-only-access-secret-not-real-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-real-0123456789
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Run database migrations
        working-directory: packages/database
        run: pnpm migrate

      - name: API tests
        run: pnpm --filter api test -- --ci

      - name: Web build
        run: pnpm --filter web build

      - name: API smoke test (boot + liveness check)
        run: |
          pnpm --filter api build
          node apps/api/dist/main.js &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/api/v1/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! grep -q '"status":"ok"' /tmp/health.json; then
            echo "Health check did not return ok:"
            cat /tmp/health.json 2>/dev/null || echo "(no response)"
            exit 1
          fi
          node -e "const h=require('/tmp/health.json'); console.log('health ok, database:', h.checks.database.status, '| integrations:', h.checks.integrations.map(i=>i.name+':'+i.provider).join(', '))"
